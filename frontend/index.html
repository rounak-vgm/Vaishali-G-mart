<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="dqVSP6Pk8j8HwXOCV5-7RZx-h155muhRzrOWyGvbtK8" />
    <title>Vaishali G Mart</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 15px 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { color: #2c3e50; font-size: 24px; }
        .nav-btns button { padding: 8px 16px; background: #3498db; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .nav-btns button:hover { background: #2980b9; }
        .section { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .hidden { display: none; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 15px; }
        .product-card { border: 1px solid #e0e0e0; border-radius: 6px; padding: 15px; text-align: center; background: #fff; }
        .product-card h3 { font-size: 16px; margin-bottom: 8px; color: #2c3e50; }
        .price-box { margin: 10px 0; }
        .mrp { text-decoration: line-through; color: #888; margin-right: 8px; font-size: 14px; }
        .selling-price { color: #27ae60; font-weight: bold; font-size: 18px; }
        .btn { padding: 8px 12px; background: #27ae60; color: #fff; border: none; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 5px; font-weight: bold; }
        .btn:hover { background: #219150; }
        input, select, textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f8f9fa; }
        .badge { padding: 4px 8px; border-radius: 4px; color: #fff; font-size: 12px; font-weight: bold; }
        .status-Pending { background: #f39c12; }
        .status-Accepted, .status-Out { background: #3498db; }
        .status-Delivered { background: #27ae60; }
        .status-Cancelled { background: #e74c3c; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Vaishali G Mart</h1>
            <div class="nav-btns">
                <button onclick="showSection('products-sec')">Store</button>
                <button onclick="showSection('cart-sec')">Cart (<span id="cart-count">0</span>)</button>
                <button onclick="showSection('track-sec')">Track Order</button>
            </div>
        </header>

        <!-- Products Section -->
        <div id="products-sec" class="section">
            <h2>Our Products</h2>
            <div id="product-list" class="product-grid">Loading products...</div>
        </div>

        <!-- Cart Section -->
        <div id="cart-sec" class="section hidden">
            <h2>Your Cart</h2>
            <div id="cart-items">Your cart is empty.</div>
            <h3 style="margin-top: 15px;">Total Amount: ₹<span id="cart-total">0</span></h3>
            
            <hr style="margin: 20px 0;">
            <h3>Customer Details</h3>
            <input type="text" id="cust-name" placeholder="Full Name">
            <input type="text" id="cust-phone" placeholder="Phone Number">
            <textarea id="cust-address" placeholder="Complete Delivery Address"></textarea>
            <button class="btn" style="padding: 12px; font-size: 16px;" onclick="placeOrder()">Place Order</button>
        </div>

        <!-- Track Order Section -->
        <div id="track-sec" class="section hidden">
            <h2>Track Your Orders</h2>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <input type="text" id="track-phone" placeholder="Enter Phone Number" style="margin:0;">
                <button class="btn" style="width: 150px; margin:0;" onclick="trackOrder()">Search</button>
            </div>
            <div id="track-results" style="margin-top: 20px;"></div>
        </div>
    </div>

    <script>
        let products = [];
        let cart = JSON.parse(localStorage.getItem('vgm_cart') || '[]');

        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        async function fetchProducts() {
            try {
                const res = await fetch('/api/products');
                products = await res.json();
                renderProducts();
            } catch(e) {
                document.getElementById('product-list').innerText = 'Failed to load products.';
            }
        }

        function renderProducts() {
            const container = document.getElementById('product-list');
            if(!products || products.length === 0) {
                container.innerHTML = '<p>No products available.</p>';
                return;
            }
            container.innerHTML = products.map(p => `
                <div class="product-card">
                    <h3>${p.name}</h3>
                    <div class="price-box">
                        ${p.mrp ? `<span class="mrp">₹${p.mrp}</span>` : ''}
                        <span class="selling-price">₹${p.selling_price}</span>
                    </div>
                    <button class="btn" onclick="addToCart(${p.id})">Add to Cart</button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            if(!prod) return;
            const exist = cart.find(item => item.id === id);
            if(exist) {
                exist.qty += 1;
            } else {
                cart.push({ id: prod.id, name: prod.name, selling_price: prod.selling_price, qty: 1 });
            }
            saveCart();
            alert(`${prod.name} added to cart!`);
        }

        function saveCart() {
            localStorage.setItem('vgm_cart', JSON.stringify(cart));
            updateCart();
        }

        function updateCart() {
            document.getElementById('cart-count').innerText = cart.reduce((acc, i) => acc + i.qty, 0);
            const container = document.getElementById('cart-items');
            
            if(cart.length === 0) {
                container.innerHTML = 'Your cart is empty.';
                document.getElementById('cart-total').innerText = '0';
                return;
            }

            let total = 0;
            container.innerHTML = `
                <table>
                    <tr><th>Product</th><th>Price</th><th>Qty</th><th>Total</th></tr>
                    ${cart.map(i => {
                        const itemTotal = i.selling_price * i.qty;
                        total += itemTotal;
                        return `<tr><td>${i.name}</td><td>₹${i.selling_price}</td><td>${i.qty}</td><td>₹${itemTotal}</td></tr>`;
                    }).join('')}
                </table>
            `;
            document.getElementById('cart-total').innerText = total;
        }

        async function placeOrder() {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const address = document.getElementById('cust-address').value.trim();

            if(!name || !phone || !address || cart.length === 0) {
                alert('Please fill all details and add items to cart.');
                return;
            }

            try {
                const res = await fetch('/api/place-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone, address, items: cart })
                });

                const data = await res.json();
                if(data.success) {
                    alert(`Order placed successfully! Order ID: #${data.orderId}`);
                    cart = [];
                    saveCart();
                    document.getElementById('cust-name').value = '';
                    document.getElementById('cust-phone').value = '';
                    document.getElementById('cust-address').value = '';
                    document.getElementById('track-phone').value = phone;
                    showSection('track-sec');
                    trackOrder();
                } else {
                    alert('Failed to place order.');
                }
            } catch(e) {
                alert("Error placing order.");
            }
        }

        async function trackOrder() {
            const phone = document.getElementById('track-phone').value.trim();
            if(!phone) return alert('Enter phone number.');

            try {
                const res = await fetch(`/api/track-order/${phone}`);
                const orders = await res.json();

                const container = document.getElementById('track-results');
                if(!orders || orders.length === 0) {
                    container.innerHTML = '<p>No active orders found.</p>';
                    return;
                }

                container.innerHTML = `
                    <table>
                        <tr><th>Order ID</th><th>Items</th><th>Total</th><th>Status</th><th>Action</th></tr>
                        ${orders.map(o => {
                            let itemString = 'Items details unavailable';
                            try { itemString = JSON.parse(o.items || '[]').map(i => `${i.name} (${i.qty})`).join(', '); } catch(e) {}
                            return `
                                <tr>
                                    <td>#${o.id}</td>
                                    <td>${itemString}</td>
                                    <td>₹${o.total_amount}</td>
                                    <td><span class="badge status-${o.status ? o.status.replace(/\s+/g, '') : 'Pending'}">${o.status}</span></td>
                                    <td>${o.status === 'Pending' ? `<button onclick="cancelOrder(${o.id})" style="color:red; background:none; border:none; cursor:pointer;">Cancel</button>` : '-'}</td>
                                </tr>
                            `;
                        }).join('')}
                    </table>
                `;
            } catch(e) {
                console.error(e);
            }
        }

        async function cancelOrder(orderId) {
            const reason = prompt('Reason for cancellation:');
            if(!reason) return;
            const res = await fetch('/api/cancel-order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ orderId, reason })
            });
            const data = await res.json();
            if(data.success) { alert('Order cancelled.'); trackOrder(); }
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchProducts();
            updateCart();
        });
    </script>
</body>
</html>
