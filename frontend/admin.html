<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Excel & Order Management</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 30px; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
        th { background-color: #343a40; color: white; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        select { padding: 5px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>1. Upload Daily Excel Sheet</h2>
        <form id="uploadForm" style="margin-top:10px;">
            <input type="file" id="excelFile" accept=".xlsx, .xls" required>
            <button type="submit" style="padding: 8px 15px; background:#28a745; color:white; border:none; cursor:pointer;">Update Products</button>
        </form>
        <p id="status" style="margin-top:8px; font-weight:bold;"></p>
    </div>

    <div class="card">
        <h2>2. Customer Received Orders</h2>
        <table>
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Customer Name</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th>Items Ordered</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="ordersTableBody"></tbody>
        </table>
    </div>

    <script>
        // Upload Excel (Relative URL Fix)
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('excelFile', document.getElementById('excelFile').files[0]);
            
            try {
                const res = await fetch('/api/upload-excel', { method: 'POST', body: formData });
                const result = await res.json();
                document.getElementById('status').innerText = result.message || 'Updated!';
            } catch (err) {
                console.error('Upload Error:', err);
                document.getElementById('status').innerText = 'Upload failed!';
            }
        });

        // Load Orders (Relative URL Fix)
        async function loadAdminOrders() {
            try {
                const res = await fetch('/api/admin/orders');
                const orders = await res.json();

                const tbody = document.getElementById('ordersTableBody');
                if (!orders || orders.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">No orders received yet.</td></tr>';
                    return;
                }

                tbody.innerHTML = orders.map(o => {
                    let items = 'No items';
                    try {
                        items = JSON.parse(o.items).map(i => `${i.name} (₹${i.selling_price})`).join('<br>');
                    } catch(e) {
                        items = o.items;
                    }

                    return `
                        <tr>
                            <td>#${o.id}</td>
                            <td><strong>${o.customer_name}</strong></td>
                            <td>${o.phone}</td>
                            <td>${o.address}</td>
                            <td>${items}</td>
                            <td><strong>₹${o.total_amount}</strong></td>
                            <td><span class="badge">${o.status}</span></td>
                            <td>
                                <select onchange="updateStatus(${o.id}, this.value)">
                                    <option value="Pending" ${o.status==='Pending'?'selected':''}>Pending</option>
                                    <option value="Out for Delivery" ${o.status==='Out for Delivery'?'selected':''}>Out for Delivery</option>
                                    <option value="Delivered" ${o.status==='Delivered'?'selected':''}>Delivered</option>
                                </select>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                console.error('Error loading orders:', err);
            }
        }

        // Update Order Status (Relative URL Fix)
        async function updateStatus(orderId, status) {
            try {
                await fetch('/api/admin/update-status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ orderId, status })
                });
                alert('Status Updated!');
                loadAdminOrders();
            } catch (err) {
                console.error('Error updating status:', err);
            }
        }

        loadAdminOrders();
    </script>
</body>
</html>
