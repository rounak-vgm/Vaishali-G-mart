<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Vaishali G Mart</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .login-card { max-width: 400px; margin: 80px auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        .login-card h2 { margin-bottom: 20px; color: #2c3e50; }
        .login-card input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        .login-card button { width: 100%; padding: 12px; background: #27ae60; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .error-msg { color: #e74c3c; margin-top: 10px; font-size: 14px; display: none; }
        header { display: flex; justify-content: space-between; align-items: center; background: #2c3e50; color: #fff; padding: 15px 25px; border-radius: 8px; margin-bottom: 20px; }
        .logout-btn { background: #e74c3c; color: #fff; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .section { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .hidden { display: none !important; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f8f9fa; }
        .btn { padding: 8px 12px; background: #3498db; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .badge { padding: 4px 8px; border-radius: 4px; color: #fff; font-size: 12px; font-weight: bold; }
        .status-Pending { background: #f39c12; }
        .status-Accepted, .status-Out { background: #3498db; }
        .status-Delivered { background: #27ae60; }
        .status-Cancelled { background: #e74c3c; }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGIN SECTION -->
        <div id="login-sec" class="login-card">
            <h2>Admin Login</h2>
            <input type="text" id="admin-user" placeholder="Username">
            <input type="password" id="admin-pass" placeholder="Password">
            <button onclick="loginAdmin()">Login</button>
            <p id="login-error" class="error-msg">Invalid Credentials</p>
        </div>

        <!-- PROTECTED DASHBOARD -->
        <div id="dashboard-sec" class="hidden">
            <header>
                <h1>Admin Control Center</h1>
                <button class="logout-btn" onclick="logoutAdmin()">Logout</button>
            </header>

            <div class="section">
                <h2>Add Product</h2>
                <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 10px; margin-top: 10px;">
                    <input type="text" id="prod-name" placeholder="Product Name">
                    <input type="number" id="prod-mrp" placeholder="MRP (₹)">
                    <input type="number" id="prod-price" placeholder="Selling Price (₹)">
                    <button class="btn" style="height: 42px; margin-top: 8px;" onclick="addProduct()">Add Product</button>
                </div>
            </div>

            <div class="section">
                <h2>Product Catalog</h2>
                <div id="admin-product-list">Loading...</div>
            </div>

            <div class="section">
                <h2>Customer Orders</h2>
                <div id="admin-order-list">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/admin/check-auth');
                const data = await res.json();
                if (data.authenticated) showDashboard();
            } catch(e) {}
        });

        async function loginAdmin() {
            const username = document.getElementById('admin-user').value.trim();
            const password = document.getElementById('admin-pass').value.trim();
            const errorElem = document.getElementById('login-error');

            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();
            if (data.success) {
                errorElem.style.display = "none";
                showDashboard();
            } else {
                errorElem.innerText = data.message || "Invalid Credentials";
                errorElem.style.display = "block";
            }
        }

        async function logoutAdmin() {
            await fetch('/api/admin/logout', { method: 'POST' });
            location.reload();
        }

        function showDashboard() {
            document.getElementById('login-sec').classList.add('hidden');
            document.getElementById('dashboard-sec').classList.remove('hidden');
            fetchAdminProducts();
            fetchAdminOrders();
        }

        async function fetchAdminProducts() {
            const res = await fetch('/api/products');
            const products = await res.json();
            const container = document.getElementById('admin-product-list');

            if (!products || products.length === 0) {
                container.innerHTML = '<p>No products found.</p>';
                return;
            }

            container.innerHTML = `
                <table>
                    <tr><th>ID</th><th>Name</th><th>MRP</th><th>Selling Price</th><th>Action</th></tr>
                    ${products.map(p => `
                        <tr>
                            <td>#${p.id}</td>
                            <td>${p.name}</td>
                            <td>₹${p.mrp || '-'}</td>
                            <td>₹${p.selling_price}</td>
                            <td><button onclick="deleteProduct(${p.id})" style="color:red; background:none; border:none; cursor:pointer;">Delete</button></td>
                        </tr>
                    `).join('')}
                </table>
            `;
        }

        async function addProduct() {
            const name = document.getElementById('prod-name').value.trim();
            const mrp = document.getElementById('prod-mrp').value;
            const price = document.getElementById('prod-price').value;

            if (!name || !price) return alert('Name and Price are required.');

            const res = await fetch('/api/admin/add-product', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, mrp, selling_price: price })
            });
            const data = await res.json();
            if(data.success) {
                alert('Product added!');
                fetchAdminProducts();
            }
        }

        async function deleteProduct(productId) {
            if(!confirm('Delete this product?')) return;
            const res = await fetch('/api/admin/delete-product', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ productId })
            });
            const data = await res.json();
            if(data.success) fetchAdminProducts();
        }

        async function fetchAdminOrders() {
            const res = await fetch('/api/admin/orders');
            if(res.status === 401) return;
            const orders = await res.json();
            const container = document.getElementById('admin-order-list');

            if (!orders || orders.length === 0) {
                container.innerHTML = '<p>No orders yet.</p>';
                return;
            }

            container.innerHTML = `
                <table>
                    <tr><th>ID</th><th>Customer</th><th>Phone</th><th>Address</th><th>Items</th><th>Total</th><th>Status</th><th>Action</th></tr>
                    ${orders.map(o => {
                        let items = '';
                        try { items = JSON.parse(o.items).map(i => `${i.name} (${i.qty})`).join(', '); } catch(e) { items = o.items; }
                        return `
                            <tr>
                                <td>#${o.id}</td>
                                <td>${o.customer_name}</td>
                                <td>${o.phone}</td>
                                <td>${o.address}</td>
                                <td>${items}</td>
                                <td>₹${o.total_amount}</td>
                                <td><span class="badge status-${o.status ? o.status.replace(/\s+/g, '') : 'Pending'}">${o.status}</span></td>
                                <td>
                                    <select onchange="updateOrderStatus(${o.id}, this.value)">
                                        <option value="">Status</option>
                                        <option value="Accepted">Accept</option>
                                        <option value="Out for Delivery">Out</option>
                                        <option value="Delivered">Delivered</option>
                                        <option value="Cancelled">Cancel</option>
                                    </select>
                                </td>
                            </tr>
                        `;
                    }).join('')}
                </table>
            `;
        }

        async function updateOrderStatus(orderId, status) {
            if(!status) return;
            const res = await fetch('/api/admin/update-order-status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ orderId, status })
            });
            const data = await res.json();
            if(data.success) fetchAdminOrders();
        }
    </script>
</body>
</html>
